name: ETL harian

on:
  schedule:
    # 10:00 UTC = 17:00 WIB, Senin-Jumat (DECISIONS.md #005).
    # Catatan: jadwal GitHub Actions bisa terlambat beberapa menit saat antrean ramai.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:            # tombol "Run workflow" di tab Actions, untuk run manual / backfill
    inputs:
      start:
        description: "Tanggal mulai (YYYY-MM-DD). Kosongkan untuk default 7 hari terakhir."
        required: false
        default: ""

concurrency:                    # jangan biarkan dua run ETL berjalan bersamaan
  group: etl
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: src

  etl:
    needs: test                 # ETL hanya jalan jika semua test lulus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Periksa secret DATABASE_URL
        # Tanpa secret ini, config.py jatuh ke database lokal (localhost) yang tidak ada di runner GitHub.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL kosong. Isi di Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Perbarui skema dan view
        # Idempotent; memastikan view di database selalu sama dengan file di sql/analytics/.
        run: python -m idx_pipeline.setup_db

      - name: Jalankan ETL
        env:
          START: ${{ inputs.start }}  # lewat env, bukan disisipkan langsung ke perintah shell
        run: |
          if [ -n "$START" ]; then
            python -m idx_pipeline.main --start "$START"
          else
            python -m idx_pipeline.main
          fi
