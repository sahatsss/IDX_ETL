services:
  db:
    image: postgres:16
    container_name: idx_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idx}
      POSTGRES_DB: ${POSTGRES_DB:-idx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # File .sql di folder ini otomatis dijalankan saat database pertama kali dibuat
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idx}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
